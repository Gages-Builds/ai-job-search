# Dependabot keeps this fork's GitHub Actions steps and the five small npm command-line tools under
# .agents/skills/*/cli current. Weekly and grouped (one PR per ecosystem) because CI runners are
# shared and scarce; security updates are opened by GitHub as soon as an advisory lands, not on the
# weekly clock. The Python code carries no dependency manifest, so there is nothing for pip here.
# Why: every tool updates itself (ruling 2026-09-25, Roxas bead gage-u7jpqi.3.10).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directories:
      - /.agents/skills/freehire-search/cli
      - /.agents/skills/jobbank-search/cli
      - /.agents/skills/jobdanmark-search/cli
      - /.agents/skills/jobindex-search/cli
      - /.agents/skills/jobnet-search/cli
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 3
